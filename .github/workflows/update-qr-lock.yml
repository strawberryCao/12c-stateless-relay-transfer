name: Update QR dependency lockfile

on:
  push:
    branches:
      - feature/qr-receive-links
    paths:
      - client/web/package.json
      - .github/workflows/update-qr-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/qr-receive-links
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Update package lock
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --workspace @stateless-relay/web
      - name: Commit lockfile
        run: |
          if git diff --quiet -- client/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git commit -m "Update lockfile for QR receive links"
          git push origin HEAD:feature/qr-receive-links
