user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    limit_req_status 429;

    # Caddy is the only caller. Restore its forwarded client IP before rate limiting.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=resolve:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=reserve:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=abandon:10m rate=30r/m;
    map $request_method $upload_limit_key {
        PUT $binary_remote_addr;
        default "";
    }
    map $request_method $download_limit_key {
        GET $binary_remote_addr;
        default "";
    }
    limit_req_zone $upload_limit_key zone=upload:10m rate=60r/m;
    limit_req_zone $download_limit_key zone=download:10m rate=120r/m;

    upstream registry_backend { server registry:8080; }
    upstream relay_backend { server relay:9090; }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 17m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /registry/api/relay/resolve {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=resolve burst=20 nodelay;
            proxy_pass http://registry_backend/api/relay/resolve;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /registry/api/relay/reserve-tokens {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=reserve burst=6 nodelay;
            proxy_pass http://registry_backend/api/relay/reserve-tokens;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /registry/api/relay/abandon-replica-placements {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=abandon burst=10 nodelay;
            proxy_pass http://registry_backend/api/relay/abandon-replica-placements;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Only a single 64-hex token path reaches Relay. /api/admin, /health,
        # registration and OpenAPI routes can never match this location.
        location ~ ^/relay/([0-9a-fA-F]{64})$ {
            # Token paths are access capabilities; never write them to access logs.
            access_log off;
            log_not_found off;
            limit_except GET PUT OPTIONS { deny all; }
            limit_req zone=upload burst=20 nodelay;
            limit_req zone=download burst=40 nodelay;
            rewrite ^/relay/(.*)$ /$1 break;
            proxy_pass http://relay_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ /\. { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
