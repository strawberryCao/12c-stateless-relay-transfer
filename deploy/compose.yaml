name: twelve-c-production

services:
  registry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.registry
    restart: unless-stopped
    init: true
    environment:
      REGISTRY_ADMIN_API_KEY: ${REGISTRY_ADMIN_API_KEY:?set REGISTRY_ADMIN_API_KEY in deploy/.env}
      REGISTRY_BLOCK_AUTH_MASTER_KEY: ${REGISTRY_BLOCK_AUTH_MASTER_KEY:?set REGISTRY_BLOCK_AUTH_MASTER_KEY in deploy/.env}
    expose:
      - "8080"
    volumes:
      - registry-data:/data
    tmpfs:
      - /tmp
      - /run/12c:uid=10001,gid=10001,mode=0750
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - control

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    restart: unless-stopped
    init: true
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in deploy/.env}
      RELAY_ADMIN_API_KEY: ${RELAY_ADMIN_API_KEY:?set RELAY_ADMIN_API_KEY in deploy/.env}
    expose:
      - "9090"
    volumes:
      - relay-data:/data
    tmpfs:
      - /tmp
      - /run/12c:uid=10001,gid=10001,mode=0750
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - control

  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
    restart: unless-stopped
    init: true
    environment:
      REGISTRY_ADMIN_API_KEY: ${REGISTRY_ADMIN_API_KEY:?set REGISTRY_ADMIN_API_KEY in deploy/.env}
      RELAY_ADMIN_API_KEY: ${RELAY_ADMIN_API_KEY:?set RELAY_ADMIN_API_KEY in deploy/.env}
    ports:
      - "127.0.0.1:8070:8070"
    tmpfs:
      - /tmp
      - /run/12c:uid=10001,gid=10001,mode=0750
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      registry:
        condition: service_healthy
      relay:
        condition: service_healthy
    networks:
      - control

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in deploy/.env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      PUBLIC_REGISTRY_URL: https://${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      registry:
        condition: service_healthy
      relay:
        condition: service_healthy
    networks:
      - edge
      - control

volumes:
  registry-data:
  relay-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  control:
    internal: true
